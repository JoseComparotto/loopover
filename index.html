<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Loopover Toroidal</title>
  
  <!-- p5.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 480px;
      width: 100%;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .game-area {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--border);
      touch-action: none;
    }

    .target-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      width: 100%;
    }

    #targetCanvas {
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .target-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .target-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .target-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button, select {
      flex: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    button:hover, select:hover {
      background: var(--border);
      border-color: var(--text-muted);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Modal de Vitória */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      border-radius: 12px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      text-align: center;
      padding: 24px;
    }

    .modal-card h2 {
      font-size: 1.5rem;
      color: #4ade80;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Loopover Toroidal</h1>
      <p class="subtitle">Deslize linhas e colunas para montar o padrão alvo</p>
    </header>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Movimentos</span>
        <span id="moveCount" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Tempo</span>
        <span id="timerText" class="stat-value">00:00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Ordem</span>
        <select id="gridSizeSelect" onchange="changeGridSize(Number(this.value))">
          <option value="3" selected>3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
        </select>
      </div>
    </div>

    <div class="target-container">
      <canvas id="targetCanvas" width="60" height="60"></canvas>
      <div class="target-info">
        <span class="target-title">Padrão Objetivo</span>
        <span id="targetPatternName" class="target-name">Carregando...</span>
      </div>
    </div>

    <div class="game-area" id="canvasWrapper">
      <!-- O canvas do p5.js será injetado aqui -->
      <div class="modal-overlay" id="victoryModal">
        <div class="modal-card">
          <h2>Padrão Resolvido!</h2>
          <p id="victoryDetails">Você completou o desafio.</p>
          <button onclick="startNewGame()">Próximo Desafio</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="startNewGame()">Sortear Outro Alvo</button>
      <button onclick="reshuffleBoard()">Reembaralhar</button>
    </div>
  </div>

  <script>
    // --- Configurações e Estado Global ---
    let N = 3;
    let W = 360, H = 360;
    let w = W / N, h = H / N;

    let colors = [];
    let grid = [];
    let targetGrid = [];
    let currentPatternName = "";

    let movesCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;
    let gameWon = false;

    // Estado do mouse / drag
    let pressedX = 0, pressedY = 0;
    let pressedRow = 0, pressedCol = 0;
    let dx = 0, dy = 0;
    let isDragging = false;

    const mod = (n, m) => ((n % m) + m) % m;

    // --- Catálogo de Padrões Estéticos ---
    const PATTERNS = [
      {
        name: "Arco-íris Horizontal",
        fn: (x, y, n) => y
      },
      {
        name: "Arco-íris Vertical",
        fn: (x, y, n) => x
      },
      {
        name: "Diagonal Descendente",
        fn: (x, y, n) => mod(x + y, n)
      },
      {
        name: "Diagonal Ascendente",
        fn: (x, y, n) => mod(x - y, n)
      },
      {
        name: "Blocos Espelhados",
        fn: (x, y, n) => (x < Math.floor(n / 2) ? y : mod(y + 1, n))
      }
    ];

    function setup() {
      // Ajusta para telas móveis mantendo formato quadrado
      const wrapper = document.getElementById("canvasWrapper");
      const size = Math.min(360, window.innerWidth - 48);
      W = size;
      H = size;
      w = W / N;
      h = H / N;

      const cv = createCanvas(W, H);
      cv.parent(wrapper);
      colorMode(HSB, 360, 100, 100);

      startNewGame();
    }

    function draw() {
      background(15, 23, 42);
      stroke(30, 41, 59);
      strokeWeight(2);

      let rx = 0, ry = 0;

      // Renderização com projeção toroidal contínua [-N, 2N)
      for (let x = -N; x < 2 * N; x++) {
        for (let y = -N; y < 2 * N; y++) {
          rx = 0;
          ry = 0;

          if (isDragging) {
            if (abs(dy) > abs(dx) && mod(x, N) === pressedCol) {
              ry = (mouseY - pressedY) % H;
            } else if (abs(dy) < abs(dx) && mod(y, N) === pressedRow) {
              rx = (mouseX - pressedX) % W;
            }
          }

          fill(colors[grid[mod(y, N)][mod(x, N)]]);
          rect(x * w + rx, y * h + ry, w, h, 4);
        }
      }
    }

    // --- Inicialização e Controle do Jogo ---
    function startNewGame() {
      document.getElementById("victoryModal").classList.remove("active");
      gameWon = false;
      movesCount = 0;
      updateMoveCounter();
      resetTimer();

      // Recria as cores no espaço HSB
      colors = [];
      for (let i = 0; i < N; i++) {
        colors.push(color((i * 360) / N, 75, 95));
      }

      // Sorteia o padrão alvo
      const pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
      currentPatternName = pattern.name;
      document.getElementById("targetPatternName").innerText = currentPatternName;

      // Monta matriz do alvo
      targetGrid = Array.from({ length: N }, (_, y) =>
        Array.from({ length: N }, (_, x) => pattern.fn(x, y, N))
      );

      // Renderiza mini preview do alvo no canvas 2D secundário
      renderTargetPreview();

      // Clona matriz alvo para o tabuleiro principal
      grid = targetGrid.map(row => [...row]);

      // Embaralha aplicando passos válidos a partir do alvo (solvabilidade garantida)
      shuffleGrid(N * 7);
    }

    function reshuffleBoard() {
      if (gameWon) return;
      grid = targetGrid.map(row => [...row]);
      shuffleGrid(N * 7);
      movesCount = 0;
      updateMoveCounter();
      resetTimer();
    }

    function changeGridSize(newN) {
      N = newN;
      w = W / N;
      h = H / N;
      startNewGame();
    }

    function shuffleGrid(steps) {
      let lastAxis = null, lastIdx = null;
      for (let i = 0; i < steps; i++) {
        const isRow = Math.random() > 0.5;
        let idx = Math.floor(Math.random() * N);
        const delta = Math.floor(Math.random() * (N - 1)) + 1;

        if (isRow === lastAxis && idx === lastIdx) {
          idx = (idx + 1) % N;
        }

        if (isRow) {
          moveRow(idx, delta);
        } else {
          moveCol(idx, delta);
        }
        lastAxis = isRow;
        lastIdx = idx;
      }
    }

    function renderTargetPreview() {
      const tc = document.getElementById("targetCanvas");
      const ctx = tc.getContext("2d");
      const cw = tc.width / N;
      const ch = tc.height / N;

      ctx.clearRect(0, 0, tc.width, tc.height);

      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const hue = (targetGrid[y][x] * 360) / N;
          ctx.fillStyle = `hsl(${hue}, 75%, 55%)`;
          ctx.fillRect(x * cw, y * ch, cw, ch);
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 1;
          ctx.strokeRect(x * cw, y * ch, cw, ch);
        }
      }
    }

    // --- Mecânica de Drag e Input ---
    function mousePressed() {
      if (gameWon) return;
      if (mouseX >= 0 && mouseX < W && mouseY >= 0 && mouseY < H) {
        pressedX = mouseX;
        pressedY = mouseY;
        pressedCol = constrain(floor(pressedX / w), 0, N - 1);
        pressedRow = constrain(floor(pressedY / h), 0, N - 1);
        isDragging = true;
      }
    }

    function mouseDragged() {
      if (!isDragging || gameWon) return;
      dx = (mouseX - pressedX) / w;
      dy = (mouseY - pressedY) / h;
    }

    function mouseReleased() {
      if (!isDragging || gameWon) return;

      const rdx = round(dx);
      const rdy = round(dy);

      if (abs(dx) > abs(dy) && rdx !== 0) {
        moveRow(pressedRow, rdx);
        movesCount++;
        updateMoveCounter();
        checkVictory();
      } else if (abs(dx) < abs(dy) && rdy !== 0) {
        moveCol(pressedCol, rdy);
        movesCount++;
        updateMoveCounter();
        checkVictory();
      }

      isDragging = false;
      pressedX = 0;
      pressedY = 0;
      dx = 0;
      dy = 0;
    }

    function moveRow(rowN, delta) {
      let shift = mod(delta, N);
      if (shift === 0) return;
      let newRow = [];
      for (let i = 0; i < N; i++) {
        newRow[i] = grid[rowN][mod(i - shift, N)];
      }
      grid[rowN] = newRow;
    }

    function moveCol(colN, delta) {
      let shift = mod(delta, N);
      if (shift === 0) return;
      let newCol = [];
      for (let i = 0; i < N; i++) {
        newCol[i] = grid[mod(i - shift, N)][colN];
      }
      for (let i = 0; i < N; i++) {
        grid[i][colN] = newCol[i];
      }
    }

    // --- Vitória e Estatísticas ---
    function checkVictory() {
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (grid[y][x] !== targetGrid[y][x]) return;
        }
      }

      // Vitória confirmada
      gameWon = true;
      clearInterval(timerInterval);
      document.getElementById("victoryDetails").innerText = 
        `Resolvido em ${movesCount} movimentos e ${formatTime(secondsElapsed)}.`;
      document.getElementById("victoryModal").classList.add("active");
    }

    function updateMoveCounter() {
      document.getElementById("moveCount").innerText = movesCount;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      document.getElementById("timerText").innerText = "00:00";
      timerInterval = setInterval(() => {
        if (!gameWon) {
          secondsElapsed++;
          document.getElementById("timerText").innerText = formatTime(secondsElapsed);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }
  </script>
</body>
</html>
