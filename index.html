<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Loopover Toroidal</title>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 380px;
      width: 100%;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-value {
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .target-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      width: 100%;
    }

    #targetCanvas {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .target-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .target-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .target-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .game-area {
      position: relative;
      width: min(88vw, 360px);
      height: min(88vw, 360px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--border);
      touch-action: none;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button, select {
      flex: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }

    button:active, select:active {
      background: var(--border);
    }

    /* Modal exibido apenas com display: flex na vitória */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      z-index: 20;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      text-align: center;
    }

    .modal-card h2 {
      font-size: 1.4rem;
      color: #4ade80;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Loopover Toroidal</h1>
      <p class="subtitle">Deslize linhas e colunas até formar o padrão alvo</p>
    </header>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Movimentos</span>
        <span id="moveCount" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Tempo</span>
        <span id="timerText" class="stat-value">00:00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Grade</span>
        <select id="gridSizeSelect" onchange="changeGridSize(Number(this.value))">
          <option value="3" selected>3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
        </select>
      </div>
    </div>

    <div class="target-container">
      <canvas id="targetCanvas" width="120" height="120"></canvas>
      <div class="target-info">
        <span class="target-title">Padrão Alvo</span>
        <span id="targetPatternName" class="target-name">Carregando...</span>
      </div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="360" height="360"></canvas>
      
      <div class="modal-overlay" id="victoryModal">
        <div class="modal-card">
          <h2>Padrão Resolvido!</h2>
          <p id="victoryDetails">Você completou o desafio.</p>
          <button onclick="startNewGame()">Próximo Desafio</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="startNewGame()">Sortear Alvo</button>
      <button onclick="reshuffleBoard()">Reembaralhar</button>
    </div>
  </div>

  <script>
    // --- Configurações da Matriz e Canvas ---
    let N = 3;
    const W = 360, H = 360;
    let w = W / N, h = H / N;

    let grid = [];
    let targetGrid = [];

    let movesCount = 0;
    let secondsElapsed = 0;
    let timerInterval = null;
    let gameWon = false;

    // Estado do Arraste
    let isDragging = false;
    let pressedX = 0, pressedY = 0;
    let currentX = 0, currentY = 0;
    let pressedRow = 0, pressedCol = 0;
    let dx = 0, dy = 0;

    const gameCanvas = document.getElementById("gameCanvas");
    const ctx = gameCanvas.getContext("2d");

    const mod = (n, m) => ((n % m) + m) % m;

    const PATTERNS = [
      { name: "Arco-íris Horizontal", fn: (x, y, n) => y },
      { name: "Arco-íris Vertical", fn: (x, y, n) => x },
      { name: "Diagonal Descendente", fn: (x, y, n) => mod(x + y, n) },
      { name: "Diagonal Ascendente", fn: (x, y, n) => mod(x - y, n) },
      { name: "Blocos Espelhados", fn: (x, y, n) => (x < Math.floor(n / 2) ? y : mod(y + 1, n)) }
    ];

    // --- Ciclo Principal de Renderização (60/120 FPS) ---
    function render() {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, W, H);

      let rx = 0, ry = 0;

      for (let x = -N; x < 2 * N; x++) {
        for (let y = -N; y < 2 * N; y++) {
          rx = 0;
          ry = 0;

          if (isDragging) {
            if (Math.abs(dy) > Math.abs(dx) && mod(x, N) === pressedCol) {
              ry = (currentY - pressedY) % H;
            } else if (Math.abs(dx) > Math.abs(dy) && mod(y, N) === pressedRow) {
              rx = (currentX - pressedX) % W;
            }
          }

          const drawX = x * w + rx;
          const drawY = y * h + ry;

          // Renderiza blocos com padding e bordas arredondadas
          const hue = (grid[mod(y, N)][mod(x, N)] * 360) / N;
          ctx.fillStyle = `hsl(${hue}, 75%, 55%)`;
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 3;

          const pad = 2;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(drawX + pad, drawY + pad, w - pad * 2, h - pad * 2, 6);
          } else {
            ctx.rect(drawX + pad, drawY + pad, w - pad * 2, h - pad * 2);
          }
          ctx.fill();
          ctx.stroke();
        }
      }

      requestAnimationFrame(render);
    }

    // --- Pointer Events API (Touch + Mouse Unificados) ---
    function getPointerPos(e) {
      const rect = gameCanvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * W,
        y: ((e.clientY - rect.top) / rect.height) * H
      };
    }

    gameCanvas.addEventListener("pointerdown", (e) => {
      if (gameWon) return;
      e.preventDefault();

      try {
        gameCanvas.setPointerCapture(e.pointerId);
      } catch (err) {}

      const pos = getPointerPos(e);
      pressedX = pos.x;
      pressedY = pos.y;
      currentX = pos.x;
      currentY = pos.y;
      dx = 0;
      dy = 0;

      pressedCol = Math.min(Math.max(Math.floor(pressedX / w), 0), N - 1);
      pressedRow = Math.min(Math.max(Math.floor(pressedY / h), 0), N - 1);
      isDragging = true;
    });

    gameCanvas.addEventListener("pointermove", (e) => {
      if (!isDragging || gameWon) return;
      e.preventDefault();

      const pos = getPointerPos(e);
      currentX = pos.x;
      currentY = pos.y;
      dx = (currentX - pressedX) / w;
      dy = (currentY - pressedY) / h;
    });

    function finishDrag(e) {
      if (!isDragging) return;
      isDragging = false;

      try {
        gameCanvas.releasePointerCapture(e.pointerId);
      } catch (err) {}

      const rdx = Math.round(dx);
      const rdy = Math.round(dy);

      if (Math.abs(dx) > Math.abs(dy) && rdx !== 0) {
        moveRow(pressedRow, rdx);
        movesCount++;
        updateMoveCounter();
        checkVictory();
      } else if (Math.abs(dy) > Math.abs(dx) && rdy !== 0) {
        moveCol(pressedCol, rdy);
        movesCount++;
        updateMoveCounter();
        checkVictory();
      }

      dx = 0;
      dy = 0;
    }

    gameCanvas.addEventListener("pointerup", finishDrag);
    gameCanvas.addEventListener("pointercancel", finishDrag);

    // --- Álgebra Toroidal ---
    function moveRow(rowN, delta) {
      let shift = mod(delta, N);
      if (shift === 0) return;
      let newRow = [];
      for (let i = 0; i < N; i++) {
        newRow[i] = grid[rowN][mod(i - shift, N)];
      }
      grid[rowN] = newRow;
    }

    function moveCol(colN, delta) {
      let shift = mod(delta, N);
      if (shift === 0) return;
      let newCol = [];
      for (let i = 0; i < N; i++) {
        newCol[i] = grid[mod(i - shift, N)][colN];
      }
      for (let i = 0; i < N; i++) {
        grid[i][colN] = newCol[i];
      }
    }

    // --- Controle de Jogo e Alvo ---
    function startNewGame() {
      document.getElementById("victoryModal").classList.remove("active");
      gameWon = false;
      movesCount = 0;
      updateMoveCounter();
      resetTimer();

      const pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
      document.getElementById("targetPatternName").innerText = pattern.name;

      targetGrid = Array.from({ length: N }, (_, y) =>
        Array.from({ length: N }, (_, x) => pattern.fn(x, y, N))
      );

      renderTargetPreview();

      // Clona e embaralha via passos válidos (solvabilidade garantida)
      grid = targetGrid.map(row => [...row]);
      shuffleGrid(N * 7);
    }

    function reshuffleBoard() {
      if (gameWon) return;
      grid = targetGrid.map(row => [...row]);
      shuffleGrid(N * 7);
      movesCount = 0;
      updateMoveCounter();
      resetTimer();
    }

    function changeGridSize(newN) {
      N = newN;
      w = W / N;
      h = H / N;
      startNewGame();
    }

    function shuffleGrid(steps) {
      let lastAxis = null, lastIdx = null;
      for (let i = 0; i < steps; i++) {
        const isRow = Math.random() > 0.5;
        let idx = Math.floor(Math.random() * N);
        const delta = Math.floor(Math.random() * (N - 1)) + 1;

        if (isRow === lastAxis && idx === lastIdx) {
          idx = (idx + 1) % N;
        }

        if (isRow) moveRow(idx, delta);
        else moveCol(idx, delta);

        lastAxis = isRow;
        lastIdx = idx;
      }
    }

    function renderTargetPreview() {
      const tc = document.getElementById("targetCanvas");
      const tctx = tc.getContext("2d");
      const cw = tc.width / N;
      const ch = tc.height / N;

      tctx.clearRect(0, 0, tc.width, tc.height);

      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const hue = (targetGrid[y][x] * 360) / N;
          tctx.fillStyle = `hsl(${hue}, 75%, 55%)`;
          tctx.fillRect(x * cw, y * ch, cw, ch);
          tctx.strokeStyle = "#0f172a";
          tctx.lineWidth = 1.5;
          tctx.strokeRect(x * cw, y * ch, cw, ch);
        }
      }
    }

    function checkVictory() {
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (grid[y][x] !== targetGrid[y][x]) return;
        }
      }

      gameWon = true;
      clearInterval(timerInterval);
      document.getElementById("victoryDetails").innerText = 
        `Resolvido em ${movesCount} movimentos e ${formatTime(secondsElapsed)}.`;
      document.getElementById("victoryModal").classList.add("active");
    }

    function updateMoveCounter() {
      document.getElementById("moveCount").innerText = movesCount;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      document.getElementById("timerText").innerText = "00:00";
      timerInterval = setInterval(() => {
        if (!gameWon) {
          secondsElapsed++;
          document.getElementById("timerText").innerText = formatTime(secondsElapsed);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    // Inicialização
    startNewGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
